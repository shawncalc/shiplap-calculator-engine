<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 640px; height: 360px; overflow: hidden;
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f5f1; color: #292524; }
  .card { display: grid; grid-template-columns: 300px 1fr; gap: 18px;
    width: 608px; height: 328px; margin: 16px; padding: 20px;
    background: #fff; border: 1px solid #e7e5e4; border-radius: 14px; }
  .left h1 { font-size: 19px; margin-bottom: 2px; }
  .left .sub { font-size: 12px; color: #a8a29e; margin-bottom: 12px; }
  svg { display: block; }
  .right { display: flex; flex-direction: column; justify-content: center; }
  .num-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #78716c; }
  .num { font-size: 64px; font-weight: 800; color: #b45309; line-height: 1.05; }
  .num small { font-size: 20px; font-weight: 600; color: #292524; }
  .detail { margin-top: 8px; font-size: 13.5px; color: #57534e; }
  .formula { margin-top: 14px; padding: 9px 12px; background: #fafaf9; border: 1px solid #e7e5e4;
    border-radius: 8px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #57534e; }
  .badge { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 700;
    color: #fff; background: #b45309; border-radius: 6px; padding: 5px 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <h1>shiplap-calculator-engine</h1>
    <div class="sub">12 ft × 8 ft wall · 1x6 · nickel gap</div>
    <svg id="wall" width="264" height="240" viewBox="0 0 264 240"></svg>
  </div>
  <div class="right">
    <div class="num-label">Rows laid</div>
    <div class="num"><span id="rows">0</span><small> / 18</small></div>
    <div class="num-label" style="margin-top:10px">Boards to buy</div>
    <div class="num" style="font-size:44px"><span id="boards">—</span></div>
    <div class="detail" id="detail">Effective board 5.375 in wide.</div>
    <div class="formula">rows = ceil(96 ÷ 5.375) = 18<br>boards = 27 × 1.10 → 30</div>
    <div class="badge">pure TypeScript · zero deps</div>
  </div>
</div>
<script>
  var rows = Number(new URLSearchParams(location.search).get('rows') || 0);
  var N = 18, W = 248, H = 232, x0 = 8, step = H / N, gap = 3;
  var s = '';
  for (var i = 0; i < N; i++) {
    var laid = i < rows;
    s += '<rect x="' + x0 + '" y="' + (i * step).toFixed(1) + '" width="' + W +
         '" height="' + (step - gap).toFixed(1) + '" rx="3" fill="' +
         (laid ? (i % 2 ? '#d6d3d1' : '#e7e5e4') : '#f5f5f4') +
         '" stroke="' + (laid ? '#a8a29e' : '#e7e5e4') + '"/>';
  }
  if (rows >= 17) { // final 4.625 in rip row — draw slightly thinner + a saw line
    s += '<text x="' + (x0 + W - 4) + '" y="' + ((N - 1) * step + step - gap - 4) +
         '" text-anchor="end" font-size="10" fill="#78716c">rip 4.63"</text>';
  }
  document.getElementById('wall').innerHTML = s;
  document.getElementById('rows').textContent = rows;
  var b = document.getElementById('boards');
  var d = document.getElementById('detail');
  if (rows === 0) { b.textContent = '–'; b.style.color = '#d6d3d1'; }
  else if (rows < 18) { b.textContent = Math.ceil((rows + Math.ceil(rows / 2)) * 1.1 - 1e-6); }
  else { b.textContent = 30; d.textContent = '27 boards + 10% waste = 30 to buy.'; }
</script>
</body>
</html>
